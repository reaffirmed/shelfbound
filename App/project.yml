name: Shelfbound
# Debug and Release build the sideload app (the IPA from GitHub Actions).
# AppStore builds the App Store app: Release plus the APP_STORE flag (see AppFlavor.swift).
configs:
  Debug: debug
  Release: release
  AppStore: release
options:
  bundleIdPrefix: app.shelfbound
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ShelfKit:
    path: ..
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
targets:
  Shelfbound:
    type: application
    platform: iOS
    scheme:
      testTargets: [ShelfboundUITests]
    sources:
      - Shelfbound
      - Shared
    dependencies:
      - target: ShelfboundWidgets
      - package: ShelfKit
        product: ShelfCore
      - package: ShelfKit
        product: SourceKit
      - package: ShelfKit
        product: RepoKit
      - package: ShelfKit
        product: LibraryKit
      - package: ShelfKit
        product: DownloadKit
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.shelfbound.Shelfbound
        MARKETING_VERSION: "0.5.8"
        CURRENT_PROJECT_VERSION: "13"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Shelfbound
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # All four on iPad, which Split View and Slide Over require.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Runs on Apple silicon Macs as "Designed for iPad".
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
      configs:
        AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
    entitlements:
      path: Shelfbound/Resources/Shelfbound.entitlements
      properties:
        com.apple.security.application-groups: [group.app.shelfbound]
    info:
      path: Shelfbound/Resources/Info.plist
      properties:
        NSSupportsLiveActivities: true
        # Only standard HTTPS and signature checks, which are exempt from export paperwork.
        ITSAppUsesNonExemptEncryption: false
        # "Open in Shelfbound" from Files, Mail and other apps copies the file in.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container]
          - CFBundleTypeName: PDF document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Comic book archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [app.shelfbound.cbz]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: app.shelfbound.cbz
            UTTypeDescription: Comic book archive
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [cbz]
              public.mime-type: [application/vnd.comicbook+zip, application/x-cbz]
        CFBundleURLTypes:
          - CFBundleURLName: app.shelfbound.links
            CFBundleURLSchemes: [shelfbound]
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - app.shelfbound.Shelfbound.refresh
          - app.shelfbound.Shelfbound.catchup

  ShelfboundWidgets:
    type: app-extension
    platform: iOS
    sources:
      - ShelfboundWidgets
      - Shared
    dependencies:
      - package: ShelfKit
        product: ShelfCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.shelfbound.Shelfbound.Widgets
        MARKETING_VERSION: "0.5.8"
        CURRENT_PROJECT_VERSION: "13"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Shelfbound
    entitlements:
      path: ShelfboundWidgets/ShelfboundWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.app.shelfbound]
    info:
      path: ShelfboundWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  ShelfboundUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ShelfboundUITests
    dependencies:
      - target: Shelfbound
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.shelfbound.Shelfbound.UITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: Shelfbound

schemes:
  # Archive this scheme for App Store Connect and TestFlight. See docs/app-store/README.md.
  Shelfbound App Store:
    build:
      targets:
        Shelfbound: all
    run:
      config: AppStore
    profile:
      config: AppStore
    analyze:
      config: AppStore
    archive:
      config: AppStore
