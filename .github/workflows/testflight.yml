name: App Store build

# Archives the App Store flavor, signs it with your Apple Developer account and
# uploads it to App Store Connect, where it shows up in TestFlight after processing.
# No Mac needed. Run it by hand from the Actions tab once these repository secrets exist
# (Settings › Secrets and variables › Actions):
#
#   APPLE_TEAM_ID     Your 10-character Team ID (developer.apple.com › Account › Membership)
#   ASC_KEY_ID        An App Store Connect API key's Key ID (Users and Access › Integrations)
#   ASC_ISSUER_ID     The Issuer ID shown above that list of keys
#   ASC_KEY_P8        The whole contents of the key's .p8 file
#
# The key needs the Admin role, so Xcode can create the distribution certificate and
# profiles in the cloud. See docs/app-store/README.md for the full walkthrough.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to App Store Connect (off just checks that signing works)
        type: boolean
        default: true

concurrency:
  group: appstore
  cancel-in-progress: false

jobs:
  archive:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check the secrets are set
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$TEAM" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ISSUER" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$KEY" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets first:$missing (see docs/app-store/README.md)"
            exit 1
          fi

      - name: Write the API key
        env:
          KEY: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd App && xcodegen generate

      - name: Archive
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cd App
          # Each upload needs a higher build number than the last.
          BUILD=$((1000 + GITHUB_RUN_NUMBER))
          status=0
          xcodebuild archive -project Shelfbound.xcodeproj -scheme "Shelfbound App Store" \
            -configuration AppStore -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Shelfbound.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD" \
            > "$RUNNER_TEMP/archive.log" 2>&1 || status=$?
          grep -E '\*\* ARCHIVE' "$RUNNER_TEMP/archive.log" || true
          if [ "$status" -ne 0 ]; then
            grep -E ': error:|error:' "$RUNNER_TEMP/archive.log" | sort -u | head -100
            tail -60 "$RUNNER_TEMP/archive.log"
            exit "$status"
          fi
          echo "Archived build $BUILD"

      - name: Export and upload
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          DESTINATION=export
          [ "$UPLOAD" = "true" ] && DESTINATION=upload
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DESTINATION</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Shelfbound.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
          if [ "$DESTINATION" = "upload" ]; then
            echo "Uploaded. It appears in App Store Connect › TestFlight once Apple finishes processing (usually 10 to 30 minutes)."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appstore-logs
          path: ${{ runner.temp }}/archive.log
          if-no-files-found: ignore

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
