name: Build IPA

# Builds an unsigned IPA for sideloading with AltStore or Sideloadly,
# which re-sign it with your own Apple ID on install.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths-ignore: ['**.md', 'examples/**', 'sdk/**']

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd App && xcodegen generate

      - name: Build for iPhone (unsigned)
        run: |
          cd App
          status=0
          xcodebuild -project Shelfbound.xcodeproj -scheme Shelfbound \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > "$RUNNER_TEMP/build.log" 2>&1 || status=$?
          grep -E '\*\* BUILD' "$RUNNER_TEMP/build.log" || true
          if [ "$status" -ne 0 ]; then
            echo "::group::Compile errors"
            grep -E ': error:' "$RUNNER_TEMP/build.log" | sort -u | head -400
            echo "::endgroup::"
            tail -60 "$RUNNER_TEMP/build.log"
            exit "$status"
          fi

      - name: Package the IPA
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/Shelfbound.app"
          test -x "$APP/Shelfbound"
          ls "$APP/PlugIns" || true
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Shelfbound.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/Shelfbound.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: Shelfbound-ipa
          path: Shelfbound.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
