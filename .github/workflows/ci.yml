name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Package tests
        run: swift test
      - name: Build app for simulator
        run: |
          brew install xcodegen
          cd App && xcodegen generate
          xcodebuild -project Shelfbound.xcodeproj -scheme Shelfbound \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -50
          exit ${PIPESTATUS[0]}

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: sdk/shelf-repo
